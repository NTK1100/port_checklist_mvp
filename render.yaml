services:
  - type: web
    name: portcall-docs-enterprise
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8080}
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8080
      - key: BRIDGE_SECRET_KEY
        value: PORTCALL_SECRET_2026
      - key: GDRIVE_BRIDGE_URL
        sync: false
      - key: PORTCALL_SECRET_KEY
        generateValue: true
